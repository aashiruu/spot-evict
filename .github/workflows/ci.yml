name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test -race -v ./...
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate
